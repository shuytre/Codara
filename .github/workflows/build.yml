name: Build Codara

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 连续 push 时取消在跑的旧任务：避免两个 90 分钟 job 抢同一份缓存
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- Job 1：Linux 全量验证（类型检查 + Rust 单测 + 主/集成测试） ----------
  # 与 Windows 构建串行依赖：Linux 跑测试便宜且快，测试不过就不产出发布产物。
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'   # key 含 pnpm-lock.yaml 哈希，frozen-lockfile 不改写 → 稳定命中

      # 只装工具链，缓存交给下面的 Swatinem/rust-cache：
      # 该 action 内置缓存默认按仓库根找 Cargo.toml（本仓根没有），会与显式缓存重复 restore/save
      - name: Setup Rust 1.77.2（读取 rust-toolchain.toml 自动锁定）
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar
          cache-on-failure: true   # 依赖变更后测试失败也要落盘，否则下次全量重编

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all（shared → sidecar → main → renderer）
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests（main + contract）
        run: pnpm test:main

      - name: Rust tests
        run: pnpm test:sidecar

      - name: Integration tests（真实 sidecar 子进程 e2e）
        run: pnpm test:integration

  # ---------- Job 2：Windows 构建 Win7 目标产物 ----------
  build:
    needs: test                # 测试不通过则不产出发布产物（门禁）
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'pnpm'

      - name: 安装 Rust 1.77.2
        uses: dtolnay/rust-toolchain@1.77.2

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar
          cache-on-failure: true

      # Electron 22.3.27 运行时 zip 约 90MB，且 postinstall 还会再下一份：
      # 不缓存的话每次构建至少两次外网下载，GitHub 限流即让 90 分钟 job 白跑。
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/.cache/electron
            ${{ runner.temp }}/electron-22.3.27
          key: electron-${{ runner.os }}-22.3.27-v1

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 将 NSIS 加入 PATH（choco 装完后当前 job 的 PATH 快照不刷新）
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS",
            "$env:ProgramData\chocolatey\lib\nsis\tools\NSIS",
            "$env:ProgramData\chocolatey\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if ($found) {
            Add-Content $env:GITHUB_PATH $found
            Write-Host "::notice title=nsis-path::makensis found at: $found"
          } else {
            Write-Host "::warning::makensis.exe not found in candidate dirs"
            Get-ChildItem "C:\Program Files (x86)", "C:\Program Files", "$env:ProgramData\chocolatey\lib" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "nsis" } | ForEach-Object { Write-Host "NSIS-like dir: $($_.FullName)" }
          }

      - name: 校验 makensis（早失败好过后面晦涩报错）
        shell: pwsh
        run: makensis /VERSION

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（shared → sidecar → main → renderer）
        run: pnpm build

      # 下面的测试步骤由 Job 1（ubuntu）全量覆盖，此处只负责产出 Win7 产物以节省 runner 时间。
      # - name: 类型检查
      #   run: pnpm -r typecheck
      # - name: 测试 - Rust sidecar
      #   run: pnpm test:sidecar
      # - name: 集成测试
      #   run: pnpm test:integration

      # ---- 先组装 portable stage，再原样作为 NSIS payload ----
      # 之前 payload 是 shared-dist/electron-dist/renderer-dist/bin 四份平铺，
      # 既没有 Codara.exe（Electron 运行时从未进 payload），resources 层级也与
      # manager.ts（resourcesPath/bin/<triple>）和 main.ts（../../renderer/dist）不匹配
      # → 装完的快捷方式指向不存在的文件。统一成 stage 布局后两处解析路径天然自洽。
      - name: 组装 stage（Electron + app + renderer + sidecar）
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $stage = "$env:RUNNER_TEMP\portable\Codara"
          $ecache = "$env:RUNNER_TEMP\electron-22.3.27"
          New-Item -ItemType Directory -Force -Path $ecache, "$stage\resources\app\dist", "$stage\resources\bin\x86_64-pc-windows-msvc" | Out-Null
          # Electron 22.3.27：最后一个支持 Win7/8/8.1 的版本
          $zip = Join-Path $ecache 'electron.zip'
          if (-not (Test-Path $zip)) {
            curl.exe -L --retry 5 --retry-delay 2 -o $zip "https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-win32-x64.zip"
          }
          Expand-Archive $zip $stage -Force
          Rename-Item "$stage\electron.exe" "Codara.exe"
          # 主进程 app（esbuild 自包含 bundle，main -> dist/main.js）
          Copy-Item electron\dist\* "$stage\resources\app\dist\" -Force
          @'
          {
            "name": "codara",
            "productName": "Codara",
            "version": "0.1.0",
            "main": "dist/main.js"
          }
          '@ | Set-Content -Encoding utf8 "$stage\resources\app\package.json"
          # renderer（main.ts 按 app/dist/../../renderer/dist 解析 → 必须保留 dist 层级：
          # 产物应为 resources\renderer\dist\index.html）
          New-Item -ItemType Directory -Force -Path "$stage\resources\renderer\dist" | Out-Null
          Copy-Item renderer\dist\* "$stage\resources\renderer\dist\" -Recurse -Force
          # sidecar（manager.ts 按 process.resourcesPath/bin/<triple>/ 解析）
          Copy-Item resources\bin\x86_64-pc-windows-msvc\codara-sidecar.exe "$stage\resources\bin\x86_64-pc-windows-msvc\" -Force
          # 许可证随安装目录分发（规格 7.10）
          node installer\scripts\gen-notices.mjs . "$stage\resources\NOTICES.txt"
          # payload ≡ portable 布局
          New-Item -ItemType Directory -Force -Path installer\nsis\payload | Out-Null
          Copy-Item "$stage\*" installer\nsis\payload\ -Recurse -Force

      - name: 打包 NSIS 安装器
        shell: pwsh
        run: |
          $out = node installer/scripts/build-installer.mjs 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out | Select-Object -Last 8 | ForEach-Object {
              $msg = ($_ -replace '%', '%25') -replace "`r|`n", ' '
              Write-Host "::error title=nsis::$msg"
            }
            exit $code
          }

      - name: 上传产物 - sidecar 可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: codara-sidecar-win7-x64
          path: resources/bin/x86_64-pc-windows-msvc/codara-sidecar.exe
          if-no-files-found: error

      - name: 上传产物 - 应用构建输出
        uses: actions/upload-artifact@v4
        with:
          name: codara-app-dist
          path: |
            shared/dist/
            electron/dist/
            renderer/dist/
          if-no-files-found: error

      - name: 上传产物 - NSIS 安装器
        uses: actions/upload-artifact@v4
        with:
          name: codara-installers
          path: installer/dist/*.exe
          if-no-files-found: error

      - name: 打包便携完整包
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Compress-Archive -Path "$env:RUNNER_TEMP\portable\Codara\*" -DestinationPath "$env:RUNNER_TEMP\Codara-portable-win7-x64.zip" -Force
          Write-Host "portable zip bytes:" (Get-Item "$env:RUNNER_TEMP\Codara-portable-win7-x64.zip").Length

      - name: 上传产物 - 便携完整包
        uses: actions/upload-artifact@v4
        with:
          name: codara-portable-win7-x64
          path: ${{ runner.temp }}/Codara-portable-win7-x64.zip
          if-no-files-found: error
