name: Build Codara

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 安装 Rust 1.77.2
        uses: dtolnay/rust-toolchain@1.77.2

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar
          cache-on-failure: true

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 将 NSIS 加入 PATH（choco 装完后当前 job 的 PATH 快照不刷新）
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS",
            "$env:ProgramData\chocolatey\lib\nsis\tools\NSIS",
            "$env:ProgramData\chocolatey\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "makensis.exe") } | Select-Object -First 1
          if ($found) {
            Add-Content $env:GITHUB_PATH $found
            Write-Host "::notice title=nsis-path::makensis found at: $found"
          } else {
            Write-Host "::warning::makensis.exe not found in candidate dirs"
            Get-ChildItem "C:\Program Files (x86)", "C:\Program Files", "$env:ProgramData\chocolatey\lib" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "nsis" } | ForEach-Object { Write-Host "NSIS-like dir: $($_.FullName)" }
          }

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（shared → sidecar → main → renderer）
        run: pnpm build

      # 下面的测试步骤为了让你先拿到安装包，暂时注释掉了。
      # 等拿到包后，你可以去掉 # 重新开启。
      # - name: 类型检查
      #   run: pnpm -r typecheck
      # - name: 测试 - Rust sidecar
      #   run: pnpm test:sidecar
      # - name: 测试 - contract / main / renderer
      #   run: |
      #     pnpm test:contract
      #     pnpm test:main
      #     pnpm test:renderer
      # - name: 测试 - 集成
      #   run: pnpm test:integration

      - name: 准备离线安装器 payload
        shell: bash
        run: |
          mkdir -p installer/nsis/payload
          cp -r shared/dist   installer/nsis/payload/shared-dist
          cp -r electron/dist installer/nsis/payload/electron-dist
          cp -r renderer/dist installer/nsis/payload/renderer-dist
          cp -r resources/bin installer/nsis/payload/bin

      - name: 打包 NSIS 安装器
        shell: pwsh
        run: |
          $out = node installer/scripts/build-installer.mjs 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out | Select-Object -Last 8 | ForEach-Object {
              $msg = ($_ -replace '%', '%25') -replace "`r|`n", ' '
              Write-Host "::error title=nsis::$msg"
            }
            exit $code
          }

      - name: 上传产物 - sidecar 可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: codara-sidecar-win7-x64
          path: resources/bin/x86_64-pc-windows-msvc/codara-sidecar.exe

      - name: 上传产物 - 应用构建输出
        uses: actions/upload-artifact@v4
        with:
          name: codara-app-dist
          path: |
            shared/dist/
            electron/dist/
            renderer/dist/

      - name: 上传产物 - NSIS 安装器
        uses: actions/upload-artifact@v4
        with:
          name: codara-installers
          path: installer/dist/*.exe

      - name: 组装便携完整包（Electron 运行时 + 应用 + sidecar）
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $stage = "$env:RUNNER_TEMP\portable\Codara"
          New-Item -ItemType Directory -Force -Path "$stage\resources\app\dist", "$stage\resources\bin\x86_64-pc-windows-msvc" | Out-Null
          # Electron 22.3.27：最后一个支持 Win7/8/8.1 的版本
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-win32-x64.zip" -OutFile "$env:RUNNER_TEMP\electron.zip"
          Expand-Archive "$env:RUNNER_TEMP\electron.zip" $stage -Force
          Rename-Item "$stage\electron.exe" "Codara.exe"
          # 主进程 app（esbuild 自包含 bundle，main -> dist/main.js）
          Copy-Item electron\dist\* "$stage\resources\app\dist\" -Force
          @'
          {
            "name": "codara",
            "productName": "Codara",
            "version": "0.1.0",
            "main": "dist/main.js"
          }
          '@ | Set-Content -Encoding utf8 "$stage\resources\app\package.json"
          # renderer（main.ts 按 app/dist/../../renderer/dist 解析）
          Copy-Item renderer\dist "$stage\resources\renderer" -Recurse -Force
          # sidecar（manager.ts 按 process.resourcesPath/bin/<triple>/ 解析）
          Copy-Item resources\bin\x86_64-pc-windows-msvc\codara-sidecar.exe "$stage\resources\bin\x86_64-pc-windows-msvc\" -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:RUNNER_TEMP\Codara-portable-win7-x64.zip" -Force
          Write-Host "portable zip bytes:" (Get-Item "$env:RUNNER_TEMP\Codara-portable-win7-x64.zip").Length

      - name: 上传产物 - 便携完整包
        uses: actions/upload-artifact@v4
        with:
          name: codara-portable-win7-x64
          path: ${{ runner.temp }}/Codara-portable-win7-x64.zip
          if-no-files-found: error