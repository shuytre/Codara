[package]
name = "codara-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2" # 硬约束：1.78+ 编译的产物放弃 Win7 Tier1 保障（规格 5.2）
description = "Codara sidecar: fs/search/terminal/git/governance/snapshot/secret/db via stdio line-delimited JSON-RPC"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
grep-searcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"

# M5 符号索引（tree-sitter 0.21 系：MSRV 兼容 Rust 1.77.2，规格 5.2）
tree-sitter = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[profile.release]
opt-level = "s"   # 老机小磁盘：优先体积
lto = true
strip = true

[lib]
name = "codara_sidecar"
path = "src/lib.rs"

[[bin]]
name = "codara-sidecar"
path = "src/main.rs"
